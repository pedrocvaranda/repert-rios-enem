const PR=[
[`Habermas + Debord: esfera pública e espetáculo`,`Habermas explica a captura institucional do debate, em que mídia e mercado tomam o lugar da argumentação. Debord explica a mudança perceptiva, em que o cidadão passa a consumir imagens em vez de pensar. Um descreve o sistema, o outro o sujeito.`,`Listados juntos sem essa distinção, os dois parecem o mesmo argumento.`,`Habermas em D2 (esfera pública e mídia como instituição); Debord em D1 (o espectador passivo).`],
[`Foucault + Freire: a escola como aparelho`,`Os dois veem a escola como aparelho de poder. Foucault mostra a disciplina que fabrica sujeitos dóceis; Freire denuncia a educação bancária, mas propõe a conscientização como saída. A tensão está em saber se a saída existe.`,`Usar só como “a escola oprime” ignora que Freire propõe uma saída e que Foucault não acredita em abolir o poder, só em resistir dentro dele.`,`Foucault na análise (D2); Freire na proposta (conclusão). Contra-argumento: para Foucault, a resistência acontece dentro do poder, não fora dele.`],
[`Kant + Singer: o círculo moral`,`Kant funda a dignidade na racionalidade e no fim em si mesmo. Singer desloca o critério para a capacidade de sofrer. É um contraste de fundamento: a mesma pergunta (quem merece consideração moral?) com respostas diferentes.`,`Singer é utilitarista, não kantiano. Apresentá-lo como ampliação de Kant é erro conceitual.`,`Como contraste: Kant (dignidade racional, que deixa os animais de fora) versus Singer (senciência). Serve a temas de alteridade e de direitos.`],
[`Galeano + Schwarz: dependência material e ideológica`,`A dependência aparece em duas camadas: a material (Galeano, extração e acumulação nos centros) e a discursiva (Schwarz, ideias liberais importadas que encobrem a estrutura arcaica).`,`Ambos diagnosticam o atraso. Sem proposta, o texto cumpre análise, mas não intervenção, e a competência de propor solução fica sem cobertura.`,`Galeano em D2 (economia); Schwarz em D1 (o discurso que mascara). A conclusão ganha força com uma proposta, como a de Celso Furtado (ver lacunas).`],
[`Sérgio Buarque + Dimenstein: o Brasil de papel`,`Buarque descreve a causa cultural: o afeto e o favor tomam o lugar da impessoalidade pública. Dimenstein descreve o efeito jurídico: a cidadania existe no papel e falha na prática. É a relação causa-consequência que o D1 e o D2 pedem.`,`Tratados como duas descrições do mesmo Brasil de papel, repetem a tese.`,`Buarque em D1 (cultura e sujeito); Dimenstein em D2 (lei e instituição). Um dos pares mais úteis para o modelo de redação.`],
[`Arendt + Bauman: pensar e sentir`,`Arendt descreve a abdicação do juízo, o funcionário que cumpre normas sem pensar. Bauman descreve a sociedade anestesiada pela velocidade e pela sobrecarga de informação. Uma é a falha do pensar; o outro, a falha do sentir.`,`Banalidade do mal e anestesia moral são facilmente tratadas como sinônimos. Se forem, o avaliador vê um repertório só.`,`Arendt para o sujeito que obedece; Bauman para o contexto que dessensibiliza. Explicite a diferença entre as duas falhas.`],
[`Mbembe + Cortina: quem vive e quem vale`,`Mbembe mostra o Estado decidindo quem pode morrer; Cortina mostra a sociedade rejeitando o pobre. Uma é a face institucional, a outra, a face moral da exclusão.`,`Os dois tratam a exclusão como descarte. Sem distinção, a tese fica redundante.`,`Cortina em D1 (atitude social, aporofobia); Mbembe em D2 (ação do Estado, necropolítica).`],
[`Ratzel (contraponto) + Milton Santos`,`Ratzel afirma que o meio determina a sociedade. Milton Santos responde que o espaço é produzido por técnica, política e mercado. Ratzel entra para ser refutado.`,`Usar Ratzel como sustentação, e não como alvo da crítica, é erro conceitual. Determinismo geográfico é conceito superado, e o avaliador lê isso como desconhecimento.`,`Ratzel em uma frase de contextualização (“há quem veja o meio como destino”); Milton Santos em D2, para mostrar a produção do espaço.`],
[`Krenak + Kopenawa: o fim do mundo`,`Kopenawa descreve a destruição concreta pelo garimpo; Krenak critica a visão de mundo que trata a Terra como recurso. Um é fato, o outro é modelo mental.`,`As duas obras usam a imagem do fim do mundo ou do céu que desaba, o que gera repetição. “Decolonialidade” vira enfeite se não for explicada.`,`Kopenawa em D2 (garimpo e extrativismo); Krenak em D1 (o produtivismo como modo de pensar). Explique a imagem uma vez só.`],
[`Marx + Varoufakis + Han: trabalho digital`,`Uma cadeia de três níveis: Marx descreve a estrutura (exército industrial de reserva), Varoufakis a nova forma de renda (a plataforma como feudo), Han a subjetividade (autoexploração).`,`Três autores sobre trabalho não cabem em dois parágrafos de desenvolvimento. Ficam superficiais.`,`Use no máximo dois: Marx (D2, estrutura) e Han (D1, sujeito). Varoufakis, se houver espaço para o tecnofeudalismo.`],
[`Platão + Machado (O Alienista): manipulação`,`Platão mostra a manipulação pela ilusão e pela demagogia; Machado mostra a autoridade científica que classifica os outros como loucos. Uma é a manipulação política, a outra, a técnica.`,`Usar a caverna como “todos são ignorantes” sem a saída do prisioneiro, que é o ponto central, empobrece o repertório.`,`Platão em D1 (a ilusão coletiva); Machado em D2 (o poder da ciência sem limites éticos).`],
[`Machado (Dom Casmurro) + pós-verdade`,`Bentinho constrói uma acusação sem provas definitivas: uma narrativa parcial de quem detém o discurso. A pós-verdade descreve o ambiente em que a emoção pesa mais que o fato. Um é o mecanismo literário, o outro é o social.`,`Citar Machado como enfeite, sem mostrar o mecanismo, não convence. O par exige explicar como a narrativa se parece com a desinformação.`,`Machado em D1 (o modo de narrar); pós-verdade em D2 (redes e instituições).`],
[`Ditadura + 8 de janeiro + Ainda Estou Aqui`,`Memória e repetição: o passado (1971, repressão e apagamento) e o presente (2023, negação do resultado eleitoral e ataque às instituições) mostram a fragilidade institucional em dois tempos.`,`Comparar sem ressalvas é anacronismo e pode soar partidário. A data de 8 de janeiro precisa estar exata.`,`8 de janeiro em D2 (fato institucional); Ainda Estou Aqui em D1 (memória e dignidade). Trate a comparação como semelhança de risco, não como equivalência.`],
[`Beauvoir + Clarice + Morrison: gênero e raça`,`A mesma estrutura em duas chaves: a mulher como Outro (Beauvoir), a invisibilidade (Macabéa) e a violência simbólica internalizada (Pecola). Três lentes sobre o mesmo mecanismo.`,`Três obras de literatura para um tema social, sem fato ou lei concreta, ficam abstratas. Falta chão.`,`Beauvoir em D1 (construção do gênero); Clarice ou Morrison como ilustração. Para D2, acrescente lei ou dado (por exemplo, a Lei Maria da Penha, de 2006).`],
[`Beauvoir + E aí, comeu?: misoginia cotidiana`,`Beauvoir explica a construção social da mulher como Outro; a peça, pelo título, mostra a conversa masculina em que a mulher vira alvo de conquista. Uma é o conceito, a outra é a cena.`,`Não confirmei o enredo da peça. Citar sem ter lido é o maior risco deste par.`,`Beauvoir para o conceito (D1); a peça como exemplo da cultura que reproduz a misoginia (D2), depois de confirmar o que ela mostra.`],
[`Positivismo + Iluminismo Sombrio: tecnocracia`,`A tecnocracia tem raiz histórica em Comte e uma versão contemporânea no Dark Enlightenment. A continuidade é a fé na eficiência como substituta da participação.`,`Iluminismo Sombrio é obscuro e politicamente marcado. Lido como opinião, enfraquece o texto. Prefira Habermas ou Arendt como contraponto à tecnocracia.`,`Positivismo em D2, como origem; Habermas como contra-argumento: a legitimidade vem da discussão, não da técnica.`],
[`Navier-Stokes + Constitutional AI: IA`,`A IA como produtora de conhecimento (a prova) e como objeto de regulação (princípios escritos). A pergunta comum é: quem valida o que a IA produz e quem decide seus limites?`,`Dois repertórios recentes e incertos. Um evento não validado e um método técnico exigem explicação que o texto não comporta.`,`Use um só. Constitutional AI tem mais base para D2 (regulação). Navier-Stokes serve como ilustração, com a ressalva de que a prova não foi validada.`]
];

const GP=[
[`Silvio Almeida: Racismo Estrutural (2019)`,`Raça como estrutura, não como episódio. É a referência mais usada para racismo no Brasil e falta na lista.`,`Pode substituir ou complementar Morrison e Adorno nos temas de desigualdade racial.`],
[`Lélia Gonzalez: racismo por denegação`,`Conceito brasileiro que explica o racismo que se nega, e une gênero e raça com contexto nacional.`,`Complementa Beauvoir e Morrison em redações sobre mulheres negras.`],
[`Thomas Piketty: O Capital no Século XXI (2013)`,`Desigualdade como dinâmica (a relação entre retorno do capital e crescimento). A lista é fraca em economia, e você já marcou esse ponto.`,`Dá base para D2 em qualquer tema de renda e concentração.`],
[`Celso Furtado: Formação Econômica do Brasil (1959)`,`A análise nacional do subdesenvolvimento, que complementa a visão latino-americana de Galeano.`,`Oferece uma proposta, algo que os pares de diagnóstico não traz.`],
[`Shoshana Zuboff: A Era do Capitalismo de Vigilância (2019)`,`Dados como matéria-prima e vigilância como modelo de negócio. Faz a ponte entre Foucault e Varoufakis com tecnologia atual.`,`Melhora os temas de redes, IA e privacidade.`],
[`Norberto Bobbio: A Era dos Direitos (1990)`,`Direitos humanos em gerações. Dá estrutura à cidadania que Arendt apenas toca.`,`Útil como D2 em temas de direitos e de Estado.`],
[`Rachel Carson: Primavera Silenciosa (1962)`,`Meio ambiente como questão de saúde e de poder industrial. A lista tem o tema, mas quase tudo em D1 filosófico.`,`Dá um repertório factual e de saúde pública para D2.`],
[`bell hooks: O feminismo é para todo mundo (2000)`,`Feminismo interseccional e acessível. Complementa Beauvoir com a dimensão de raça e classe.`,`Ajuda a evitar que o tema de gênero fique restrito a uma só classe social.`]

const PR2=[
[`Kant + Ishiguro: o outro como meio`,`Kant dá o critério: o ser humano nunca deve ser usado apenas como meio. Ishiguro dá o caso em que esse critério é violado de forma naturalizada, com clones educados para aceitar a doação. O conceito fundamenta, e a obra ilustra.`,`Tratar o romance como argumento, em vez de exemplo, faz o avaliador esperar o conceito que não aparece.`,`Kant em D1 (dever e dignidade); Ishiguro em D2 como caso de produção sistemática de pessoas para fins alheios.`],
[`Pascal + Debord: distração e espetáculo`,`Pascal diagnostica o divertimento como fuga do pensamento sobre a própria condição. Debord mostra o espetáculo como sistema que produz e vende essa fuga. Um é antropologia, o outro economia política da imagem.`,`Listados juntos como “distração alienante”, repetem a mesma ideia. A separação sujeito e sistema é o que dá o segundo argumento.`,`Pascal em D1 (o sujeito que foge de si); Debord em D2 (a indústria que organiza a fuga).`],
[`Kafka + Arendt: a burocracia vista de dois lados`,`Kafka descreve quem é processado por uma burocracia opaca, sem saber a acusação. Arendt descreve quem opera a máquina sem pensar sobre o que faz. Um é a vítima, o outro é o executor.`,`As duas obras tratam de burocracia, e sem a distinção de lado parecem uma só. Além disso, a lista tem duas entradas de Arendt: não use as duas no mesmo texto.`,`Kafka em D1 (a experiência de quem é processado); Arendt em D2 (a engrenagem de funcionários).`],
[`Platão + Saramago: a culpa é do povo ou de quem governa?`,`Platão culpa a liberdade excessiva da multidão, que abre caminho à demagogia. Saramago mostra um Estado que responde ao voto em branco com medo, e não com escuta. É um contraste de diagnóstico sobre onde nasce a crise política.`,`Usar a caverna como “o povo é ignorante” repete o erro de Platão. A alegoria trata de conhecimento, e não de culpa coletiva.`,`Platão como visão a questionar em D1; Saramago em D2 (instituição que não ouve). Ótimo para uma conclusão que retoma a tese.`],
[`Nietzsche + Freire: o ressentimento do oprimido`,`Nietzsche desconfia da moral dos fracos, que chama de virtude aquilo que é ressentimento. Freire vê no oprimido a capacidade de se libertar pela conscientização. Os dois discutem a relação entre opressão e moral.`,`Tomar Nietzsche como apologia dos fortes é erro. Ele critica a moral, não os oprimidos. Sem essa distinção, o par parece contraditório.`,`Como tensão produtiva: a valorização da vítima pode virar ressentimento? Freire responde pela ação coletiva.`],
[`Otelo + pós-verdade: o rumor que se completa`,`Otelo mostra o mecanismo: a insinuação, e o próprio sujeito que completa a história. A pós-verdade mostra o ambiente em que isso é normal. Um é microfísica, o outro é estrutura.`,`Dom Casmurro usa a mesma estrutura de acusação sem prova. Citar os dois é redundância. Escolha um como principal.`,`Otelo em D1 (a credulidade de quem é manipulado); pós-verdade em D2 (redes e instituições).`],
[`Kautsky + Diamond: a desigualdade agrária é econômica ou geográfica?`,`Kautsky explica a concentração da terra pela lógica do capital. Diamond explains a desigualdade entre sociedades pela geografia. É um contraste de causa: a terra se concentra por escolha política ou por condição natural?`,`Escala incompatível: Diamond fala de continentes e Kautsky da economia agrária europeia do século XIX. Aplicar Diamond diretamente ao Brasil sem ressalva é forçar a relação.`,`Kautsky em D2 (propriedade e mercado); Diamond como alternativa a discutir, com a crítica de determinismo.`],
[`Ratzel + Diamond: o determinismo antigo e o moderno`,`Ratzel é a versão histórica do determinismo geográfico. Diamond é a versão atual, com dados e uma tese mais sofisticada. Mostrar a continuidade e a crítica torna o par sólido.`,`Ratzel como sustentação é erro conceitual. Diamond como verdade consolidada ignora que a crítica ao determinismo é forte na academia.`,`Ratzel em uma frase de contextualização; Diamond como tese a discutir; Milton Santos como resposta de que a técnica e a política produzem o espaço.`],
[`Esaú e Jacó + Buarque: a encenação da conciliação`,`Buarque explica a causa cultural: afeto e favor tomam o lugar da impessoalidade. Machado mostra a encenação: a República muda os nomes e os partidos, e a elite continua no comando.`,`A mesma tese de conciliação brasileira. Sem uma camada a mais, o par parece repetição.`,`Buarque em D1 (a cultura do favor); Esaú e Jacó em D2 (continuidade política de 1889).`],
[`Memórias Póstumas + O Cortiço: duas faces da sociedade escravocrata`,`Brás Cubas mostra a elite ociosa e irônica, que não vê a violência do cotidiano. O Cortiço mostra a miséria popular, descrita pelo meio e pela herança. São as duas pontas da mesma sociedade.`,`O Cortiço é naturalismo determinista, e Brás é ironia. Misturar os registros sem explicar confunde o avaliador.`,`Brás Cubas em D1 (o sujeito privilegiado que não enxerga); O Cortiço em D2 (habitação e exploração).`],
[`Frankl + Arendt: o sentido resiste à exclusão?`,`Frankl afirma que o indivíduo mantém liberdade para escolher a atitude mesmo no campo de concentração. Arendt mostra o homem supérfluo, que o sistema não precisa como trabalhador nem consumidor. A pergunta comum: o sentido individual resiste à exclusão estrutural?`,`Usar Frankl como “basta ter atitude positiva” é leitura rasa e moralista. Ele não nega a estrutura, e sim pergunta o que resta ao sujeito dentro dela.`,`Frankl em D1 (sentido e resiliência); Arendt em D2 (o sistema que descarta). A tensão é o argumento.`],
[`Berger + Eco: o olhar e o padrão de beleza`,`Berger mostra o olhar que aprisiona: a mulher como aparição feita para ser vista. Eco mostra que o padrão de beleza é histórico e se apresenta como natureza. Juntos explicam como a norma é construída e imposta pelo olhar.`,`Morrison também trata de beleza (Pecola). Três obras sobre o mesmo ponto saturam o texto.`,`Berger em D1 (objetificação e olhar); Eco em D2 (padrão histórico e exclusão de corpos).`],
[`Schopenhauer + Frankl: o sofrimento tem saída?`,`Schopenhauer diz que a vida oscila entre dor e tédio, e que a arte é alívio temporário. Frankl responde que o sentido é possível mesmo no sofrimento. É um contraste entre pessimismo e sentido.`,`Acrescentar Dhammapada sobrecarrega o par. Escolha um eixo: desejo ou sentido.`,`Schopenhauer como pessimismo a contrapor; Frankl como resposta, em D1.`],
[`Bulgákov + Orwell: o artista e o Estado censor`,`Bulgákov mostra o artista que queima o próprio manuscrito por medo. Orwell mostra o Estado que controla a linguagem e a história. Um é o sujeito, o outro é a máquina.`,`Com Bradbury, são três censuras. É clichê e dilui o argumento.`,`Bulgákov em D1 (a autocensura do artista); Orwell em D2 (o Estado e a linguagem). Deixe Bradbury de fora.`],
[`Lefebvre + Jacobs: a cidade como obra coletiva`,`Lefebvre oferece a tese filosófica: o direito à cidade é o direito de participar da produção do espaço urbano. Jacobs oferece o exemplo empírico de ruas vivas e diversidade de uso.`,`Ambos dizem “a cidade é das pessoas”. Sem a divisão tese e exemplo, o par é redundante.`,`Lefebvre em D1 (direito e participação); Jacobs em D2 (urbanismo que demoliu bairros, com Pereira Passos como contraste).`],
[`Positivismo + Subsolo: a tecnocracia e o limite da razão`,`Comte fundamenta a razão técnica como guia da sociedade. Dostoiévski mostra o limite: o homem não é previsível por cálculo, e a liberdade inclui agir contra o próprio interesse. Substitui Iluminismo Sombrio, que era mais arriscado.`,`Notas do Subsolo é ficção com um narrador antipático. Usá-lo como tese exige explicar o contexto e não só citar a frase.`,`Positivismo em D2 (tecnocracia como origem); Subsolo em D1 (a objeção ao homem calculável).`]
];

function flg(t){const o=[];for(const k in FL){if(t.includes(k)&&!o.includes(FL[k]))o.push(FL[k])}return o.join(' ')}
